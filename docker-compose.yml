version: "3.9"

services:
  php7_server:
    container_name: php7_laravel
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./bansmjatim:/app
    networks:
      - php7_network
    restart: always
    # php-fpm runs on port 9000 internally
    command: php-fpm
    depends_on:
      - db

  db:
    image: mysql:8.4.0
    container_name: php7_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: banc9232_laravel
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    ports:
      - "5001:3306"
    volumes:
      - volume-db:/var/lib/mysql
    restart: always
    command: mysqld --sql_mode="STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"
    networks:
      - php7_network

  # nginx (optional, recommended for serving Laravel)
  nginx:
    image: nginx:latest
    container_name: php7_nginx
    ports:
      - "5000:80"
    volumes:
      - ./bansmjatim:/app
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php7_server
    networks:
      - php7_network

networks:
  php7_network:

volumes:
  volume-db:
